# sml.style.yaml — SML generation style configuration
#
# This file controls how SML is generated by:
#   generate-sml-from-ddl
#   generate-sml-from-connection
#   generate-metrics-from-model
#
# Priority: CLI flags  >  this file  >  hardcoded defaults
#
# After each generation run, the effective settings (including any defaulted
# values) are written to <output-dir>/sml.style.yaml so the output directory
# always documents exactly how it was produced.
#
# This reference copy lives in resources/style/sml.style.yaml.
# Copy it to your working directory (or any path and pass --sml-config-file)
# to customise generation without repeating flags on every command.

# ── SML generation ─────────────────────────────────────────────────────────────
# Used by: generate-sml-from-ddl, generate-sml-from-connection

# PII column exclusion threshold.
# Columns at this severity AND above are excluded from secondary attributes.
#   "HIGH"   – SSN, passwords, payment card numbers, biometric identifiers
#   "MEDIUM" – email, phone, date of birth, government ID  (default)
#   "LOW"    – full names, street addresses, ZIP codes, IP addresses
#   "none"   – disable PII exclusion entirely
pii-severity: MEDIUM

# Tables to force-classify as fact tables, overriding automatic FK-topology
# detection.  List format; empty list means fully automatic.
fact-tables: []

# Catalog display name written into catalog.yml and model.yml.
# Leave empty (or omit) to default to the model name.
catalog-name: ""

# When true, dataset and dimension .yml filenames use lowerCamelCase derived
# from the source table name (e.g. factInventoryTransaction.yml).
# When false (default), the raw source table name is used as-is.
camel-case-files: false

# When true, metric labels use lowerCamelCase (e.g. "primaryQuantitySum").
# When false (default), metric labels use Title Case (e.g. "Primary Quantity Sum").
# Deprecated: prefer label-style for a unified label style across all objects.
camel-case-measures: false

# Label style applied to ALL SML object labels: datasets, dimensions, hierarchies,
# level attributes, secondary attributes, and metrics.
#   "title-case" (default) — strip dim_/_dimension/_key etc., then Title Case
#   "camel-case"           — strip same affixes, then lowerCamelCase
#   "none"                 — use raw source table/column name with no transformation
# When label-style is set, it overrides camel-case-measures.
label-style: title-case

# Maximum rows to sample per table for column type inference.
# Set to 0 to disable sampling (always 0 for generate-sml-from-ddl).
# Only applies to generate-sml-from-connection.
sample-size: 250

# Minimum number of hierarchies a dimension must have to be included in the
# semantic model.  Dimensions whose inferred hierarchy count falls below this
# threshold are silently dropped.  The default of 1 means only dimensionless
# tables (0 hierarchies) are excluded.  Set to 0 to keep all dimensions.
min-hierarchies-per-dim: 1

# Maximum number of hierarchies to keep per dimension.  When the inference
# engine produces more hierarchies than this limit the list is truncated to
# the first N (highest-ranked) entries.  Set to 0 to keep all hierarchies.
max-hierarchies-per-dim: 4

# ── generate-metrics-from-model ────────────────────────────────────────────────

# Maximum number of metric suggestions to output.
max-suggestions: 25

# Minimum relevance score [0.0–1.0] for a suggestion to be included.
min-score: 0.5

# When true, include multi-dimension (tuple) suggestions in addition to
# single-dimension suggestions.
include-tuples: true
