name: Extract AtScale Model

on:
  workflow_dispatch:
    inputs:
      model:
        description: AtScale model identifier
        required: true
        type: string
      connection-name:
        description: Connection name within the connection file
        required: true
        type: string
      output-model-file:
        description: Output file path for the extracted model (leave blank to print to stdout)
        required: false
        type: string
        default: model.yml

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Write connection file
        run: echo "${{ secrets.ATSCALE_CONNECTION_FILE }}" > connection.yml

      - name: Extract AtScale model
        run: |
          node dist/cli.js extract-model-from-atscale \
            --model "${{ inputs.model }}" \
            --connection-file connection.yml \
            --connection-name "${{ inputs.connection-name }}" \
            ${{ inputs.output-model-file && format('--output-model-file "{0}"', inputs.output-model-file) || '' }}

      - name: Upload extracted model
        if: ${{ inputs.output-model-file != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: extracted-model
          path: ${{ inputs.output-model-file }}
