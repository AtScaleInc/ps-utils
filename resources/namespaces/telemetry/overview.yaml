---
version: 1
title: Telemetry Dashboard (Tableau Template)
description: Template for building a Tableau dashboard mirroring the app's KPIs and
  visualizations.

# -- Project Specific
# connections.yaml
# models.yaml (mdx + sql columns): Auto generated
# aliases.yaml (aliases for measures) : Optional, recommended for AtScale PS team to use

# -- Functional Specific / Visualizations
# Telemetry.yaml (worksheet definitions)

# -- BI Tool Specific - Should not be modified unless new BI tool
# tableau.yaml (worksheet interpretation)

# =============================================================================
# WORKSHEET OPTIONS REFERENCE
# -----------------------------------------------------------------------------
# graphType: bar | line | text
#
# bar:
#   xAxis, yAxis       - required column names from model
#   format             - optional: integer | decimal:N | percent:N | currency:N
#   limit              - optional int: emit a top-N filter on the dimension axis
#   sortDirection      - optional: asc | desc (default: desc)
#   colorField         - optional column name for color breakdown encoding
#
# line:
#   xAxis, yAxis       - required column names from model
#   xAxisGranularity   - optional: day | week | month | quarter | year (default: week for DATETIME)
#   colorField         - optional column name for color breakdown encoding
#
# text:
#   measures           - list of column names (or use xAxis + yAxis)
#   format             - optional: integer | decimal:N | percent:N | currency:N
# =============================================================================

worksheets:
  # Summary Statistics - Single number displays
  summary_total_orgs:
    title: Total Organizations
    model: Telemetry
    graphType: text
    measures:
      - m_organization_id_distinct
    format: "integer"
    description: Count of unique organization_id values

  summary_total_cubes:
    title: Total Cubes
    model: Telemetry
    graphType: text
    measures:
      - m_cube_name_distinct
    format: "integer"
    description: Count of unique cube_name values

  summary_total_users:
    title: Total Users
    model: Telemetry
    graphType: text
    measures:
      - m_user_hash_distinct
    format: "integer"
    description: Count of unique user_hash values

  summary_avg_queries_per_day:
    title: Avg Queries/Day
    model: Telemetry
    graphType: text
    measures:
      - m_query_id_count
    format: "decimal:2"
    description: Daily average of TotalQueries over the entire time period

  summary_success_rate:
    title: Success Rate (%)
    model: Telemetry
    graphType: text
    measures:
      - cm_query_success_pct
    format: "percent:2"
    description: Percentage of succeeded queries to two decimal places

  summary_avg_wall_time:
    title: Avg WallTime (ms)
    model: Telemetry
    graphType: text
    measures:
      - m_epoch_sql_wall_time_avg
    format: "decimal:2"
    description: Average WallTime to two decimal places

  # KPI Visuals
  kpi_query_success_rate:
    title: Query Success Rate
    model: Telemetry
    graphType: line
    xAxis: query_hour
    xAxisGranularity: week
    yAxis: succeeded
    colorField: service
    sortDirection: desc
    filters:
    - field: succeeded
      excludeNull: true

  kpi_total_queries_per_day:
    title: TotalQueries per Day
    model: Telemetry
    graphType: line
    xAxis: query_hour
    xAxisGranularity: day
    yAxis: m_subquery_count_sum

  kpi_response_time:
    title: ResponseTime(ms)
    model: Telemetry
    graphType: line
    xAxis: query_hour
    xAxisGranularity: week
    yAxis: m_epoch_sql_wall_time_avg

  # Additional Information (Top 10s)
  top_10_active_users:
    title: Top 10 Most Active Users
    model: Telemetry
    graphType: bar
    xAxis: m_subquery_count_sum
    yAxis: user_hash
    limit: 10
    sortDirection: desc

  top_10_cubes_by_avg_wall_time:
    title: Top 10 CubeNames by AvgWallTime
    model: Telemetry
    graphType: bar
    xAxis: m_epoch_sql_wall_time_avg
    yAxis: cube_name
    limit: 10
    sortDirection: desc

  top_10_users_by_avg_wall_time:
    title: Top 10 UserHash by AvgWallTime
    model: Telemetry
    graphType: bar
    xAxis: m_epoch_sql_wall_time_avg
    yAxis: user_hash
    limit: 10
    sortDirection: desc

  top_10_orgs_by_avg_wall_time:
    title: Top 10 OrganizationId by AvgWallTime
    model: Telemetry
    graphType: bar
    xAxis: m_epoch_sql_wall_time_avg
    yAxis: organization_id
    limit: 10
    sortDirection: desc

  top_10_projects_by_avg_wall_time:
    title: Top 10 ProjectId by AvgWallTime
    model: Telemetry
    graphType: bar
    xAxis: m_epoch_sql_wall_time_avg
    yAxis: project_id
    limit: 10
    sortDirection: desc

dashboards:
  # ============================================================================
  # COMPREHENSIVE TELEMETRY DASHBOARD
  # Layout: Section headers (1 row each) followed by worksheet tiles
  #
  # Grid: 3 columns x 49 rows (100px per segment)
  # Sections:
  #   y=0       → "Summary Statistics" header
  #   y=1–4     → Summary Statistics tiles (2 rows × 3 cols)
  #   y=5       → "KPI Visuals" header
  #   y=6–20    → KPI line charts (3 charts × 5 rows each)
  #   y=21      → "Additional Information" header
  #   y=22–48   → Top-10 bar charts (5 charts × 5 rows each, last 7 rows)
  # ============================================================================
  Telemetry_comprehensive:
    title: Telemetry Dashboard
    description: Comprehensive view of Telemetry metrics organized by Summary Statistics, KPIs, and Additional Information

    size:
      width: 1800
      height: 4900
      hSegments: 3
      vSegments: 49

    # ------------------------------------------
    # CATEGORY SECTION HEADERS
    # Each header spans full width (colSpan: 3), 1 row tall.
    # The EJS template emits these as Tableau title zones.
    # ------------------------------------------
    categoryHeaders:
      - label: "Summary Statistics"
        x: 0
        y: 0
        colSpan: 3
        rowSpan: 1
      - label: "KPI Visuals"
        x: 0
        y: 5
        colSpan: 3
        rowSpan: 1
      - label: "Additional Information"
        x: 0
        y: 21
        colSpan: 3
        rowSpan: 1

    tiles:
      # ------------------------------------------
      # SUMMARY STATISTICS (3x2 grid, y=1–4)
      # Row 1 (y=1): Users | Organizations | Cubes
      # Row 2 (y=3): Avg Queries | Success Rate | Avg WallTime
      # ------------------------------------------
      - worksheet: summary_total_users
        x: 0
        y: 1
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics
      - worksheet: summary_total_orgs
        x: 1
        y: 1
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics
      - worksheet: summary_total_cubes
        x: 2
        y: 1
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics
      - worksheet: summary_avg_queries_per_day
        x: 0
        y: 3
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics
      - worksheet: summary_success_rate
        x: 1
        y: 3
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics
      - worksheet: summary_avg_wall_time
        x: 2
        y: 3
        colSpan: 1
        rowSpan: 2
        category: Summary Statistics

      # ------------------------------------------
      # KPI VISUALS (full width, y=6–20)
      # ------------------------------------------
      - worksheet: kpi_query_success_rate
        x: 0
        y: 6
        colSpan: 3
        rowSpan: 5
        category: KPI Visuals
      - worksheet: kpi_total_queries_per_day
        x: 0
        y: 11
        colSpan: 3
        rowSpan: 5
        category: KPI Visuals
      - worksheet: kpi_response_time
        x: 0
        y: 16
        colSpan: 3
        rowSpan: 5
        category: KPI Visuals

      # ------------------------------------------
      # ADDITIONAL INFORMATION (full width, y=22–48)
      # ------------------------------------------
      - worksheet: top_10_active_users
        x: 0
        y: 22
        colSpan: 3
        rowSpan: 5
        category: Additional Information
      - worksheet: top_10_cubes_by_avg_wall_time
        x: 0
        y: 27
        colSpan: 3
        rowSpan: 5
        category: Additional Information
      - worksheet: top_10_users_by_avg_wall_time
        x: 0
        y: 32
        colSpan: 3
        rowSpan: 5
        category: Additional Information
      - worksheet: top_10_orgs_by_avg_wall_time
        x: 0
        y: 37
        colSpan: 3
        rowSpan: 5
        category: Additional Information
      - worksheet: top_10_projects_by_avg_wall_time
        x: 0
        y: 42
        colSpan: 3
        rowSpan: 7
        category: Additional Information
