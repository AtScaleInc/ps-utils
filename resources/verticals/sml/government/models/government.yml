unique_name: government
object_type: model
label: government
relationships:
  -     unique_name: government_budget_fact_dim-agency_agency_id
        from:
          dataset: government_budget_fact
          join_columns:
            - agency_id
        to:
          dimension: Dim Agency
          level: la_agency_id
  -     unique_name: government_budget_fact_dim-program_program_id
        from:
          dataset: government_budget_fact
          join_columns:
            - program_id
        to:
          dimension: Dim Program
          level: la_program_id
  -     unique_name: government_budget_fact_dim-fund_fund_id
        from:
          dataset: government_budget_fact
          join_columns:
            - fund_id
        to:
          dimension: Dim Fund
          level: la_fund_id
  -     unique_name: government_budget_fact_dim-object-class_object_class_id
        from:
          dataset: government_budget_fact
          join_columns:
            - object_class_id
        to:
          dimension: Dim Object Class
          level: la_object_class_id
  -     unique_name: government_budget_fact_dim-geography_geography_id
        from:
          dataset: government_budget_fact
          join_columns:
            - geography_id
        to:
          dimension: Dim Geography
          level: la_geography_id
  -     unique_name: government_budget_fact_dim-fiscal-calendar_fiscal_calendar_id
        from:
          dataset: government_budget_fact
          join_columns:
            - fiscal_calendar_id
        to:
          dimension: Dim Fiscal Calendar
          level: la_fiscal_calendar_id
