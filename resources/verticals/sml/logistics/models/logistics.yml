unique_name: logistics
object_type: model
label: logistics
relationships:
  -     unique_name: logistics_shipment_fact_dim-origin_origin_id
        from:
          dataset: logistics_shipment_fact
          join_columns:
            - origin_id
        to:
          dimension: Dim Origin
          level: la_origin_id
  -     unique_name: logistics_shipment_fact_dim-destination_destination_id
        from:
          dataset: logistics_shipment_fact
          join_columns:
            - destination_id
        to:
          dimension: Dim Destination
          level: la_destination_id
  -     unique_name: logistics_shipment_fact_dim-carrier_carrier_id
        from:
          dataset: logistics_shipment_fact
          join_columns:
            - carrier_id
        to:
          dimension: Dim Carrier
          level: la_carrier_id
  -     unique_name: logistics_shipment_fact_dim-warehouse_warehouse_id
        from:
          dataset: logistics_shipment_fact
          join_columns:
            - warehouse_id
        to:
          dimension: Dim Warehouse
          level: la_warehouse_id
  -     unique_name: logistics_shipment_fact_dim-ship-date_ship_date_id
        from:
          dataset: logistics_shipment_fact
          join_columns:
            - ship_date_id
        to:
          dimension: Dim Ship Date
          level: la_ship_date_id
