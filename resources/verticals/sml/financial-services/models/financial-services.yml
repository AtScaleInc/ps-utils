unique_name: financial-services
object_type: model
label: financial-services
relationships:
  -     unique_name: financial_securities_fact_dim-security_security_id
        from:
          dataset: financial_securities_fact
          join_columns:
            - security_id
        to:
          dimension: Dim Security
          level: la_security_id
  -     unique_name: financial_securities_fact_dim-issuer_issuer_id
        from:
          dataset: financial_securities_fact
          join_columns:
            - issuer_id
        to:
          dimension: Dim Issuer
          level: la_issuer_id
  -     unique_name: financial_securities_fact_dim-portfolio_portfolio_id
        from:
          dataset: financial_securities_fact
          join_columns:
            - portfolio_id
        to:
          dimension: Dim Portfolio
          level: la_portfolio_id
  -     unique_name: financial_securities_fact_dim-price-date_price_date_id
        from:
          dataset: financial_securities_fact
          join_columns:
            - price_date_id
        to:
          dimension: Dim Price Date
          level: la_price_date_id
