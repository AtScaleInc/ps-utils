unique_name: pharma
object_type: model
label: pharma
relationships:
  -     unique_name: pharma_clinical_fact_dim-compound_compound_id
        from:
          dataset: pharma_clinical_fact
          join_columns:
            - compound_id
        to:
          dimension: Dim Compound
          level: la_compound_id
  -     unique_name: pharma_clinical_fact_dim-trial_trial_id
        from:
          dataset: pharma_clinical_fact
          join_columns:
            - trial_id
        to:
          dimension: Dim Trial
          level: la_trial_id
  -     unique_name: pharma_clinical_fact_dim-investigator_investigator_id
        from:
          dataset: pharma_clinical_fact
          join_columns:
            - investigator_id
        to:
          dimension: Dim Investigator
          level: la_investigator_id
  -     unique_name: pharma_clinical_fact_dim-regulatory_regulatory_id
        from:
          dataset: pharma_clinical_fact
          join_columns:
            - regulatory_id
        to:
          dimension: Dim Regulatory
          level: la_regulatory_id
  -     unique_name: pharma_clinical_fact_dim-study-date_study_date_id
        from:
          dataset: pharma_clinical_fact
          join_columns:
            - study_date_id
        to:
          dimension: Dim Study Date
          level: la_study_date_id
