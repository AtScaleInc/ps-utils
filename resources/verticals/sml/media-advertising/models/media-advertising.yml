unique_name: media-advertising
object_type: model
label: media-advertising
relationships:
  -     unique_name: media_ad_performance_fact_dim-campaign_campaign_id
        from:
          dataset: media_ad_performance_fact
          join_columns:
            - campaign_id
        to:
          dimension: Dim Campaign
          level: la_campaign_id
  -     unique_name: media_ad_performance_fact_dim-creative_creative_id
        from:
          dataset: media_ad_performance_fact
          join_columns:
            - creative_id
        to:
          dimension: Dim Creative
          level: la_creative_id
  -     unique_name: media_ad_performance_fact_dim-placement_placement_id
        from:
          dataset: media_ad_performance_fact
          join_columns:
            - placement_id
        to:
          dimension: Dim Placement
          level: la_placement_id
  -     unique_name: media_ad_performance_fact_dim-audience_audience_id
        from:
          dataset: media_ad_performance_fact
          join_columns:
            - audience_id
        to:
          dimension: Dim Audience
          level: la_audience_id
  -     unique_name: media_ad_performance_fact_dim-report-date_report_date_id
        from:
          dataset: media_ad_performance_fact
          join_columns:
            - report_date_id
        to:
          dimension: Dim Report Date
          level: la_report_date_id
