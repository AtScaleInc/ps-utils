unique_name: human-resources
object_type: model
label: human-resources
relationships:
  -     unique_name: hr_workforce_fact_dim-employee_employee_id
        from:
          dataset: hr_workforce_fact
          join_columns:
            - employee_id
        to:
          dimension: Dim Employee
          level: la_employee_id
  -     unique_name: hr_workforce_fact_dim-organization_organization_id
        from:
          dataset: hr_workforce_fact
          join_columns:
            - organization_id
        to:
          dimension: Dim Organization
          level: la_organization_id
  -     unique_name: hr_workforce_fact_dim-job_job_id
        from:
          dataset: hr_workforce_fact
          join_columns:
            - job_id
        to:
          dimension: Dim Job
          level: la_job_id
  -     unique_name: hr_workforce_fact_dim-location_location_id
        from:
          dataset: hr_workforce_fact
          join_columns:
            - location_id
        to:
          dimension: Dim Location
          level: la_location_id
  -     unique_name: hr_workforce_fact_dim-snapshot-date_snapshot_date_id
        from:
          dataset: hr_workforce_fact
          join_columns:
            - snapshot_date_id
        to:
          dimension: Dim Snapshot Date
          level: la_snapshot_date_id
