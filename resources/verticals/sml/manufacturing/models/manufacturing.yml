unique_name: manufacturing
object_type: model
label: manufacturing
relationships:
  -     unique_name: manufacturing_production_fact_dim-facility_facility_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - facility_id
        to:
          dimension: Dim Facility
          level: la_facility_id
  -     unique_name: manufacturing_production_fact_dim-product_product_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - product_id
        to:
          dimension: Dim Product
          level: la_product_id
  -     unique_name: manufacturing_production_fact_dim-supplier_supplier_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - supplier_id
        to:
          dimension: Dim Supplier
          level: la_supplier_id
  -     unique_name: manufacturing_production_fact_dim-cost-center_cost_center_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - cost_center_id
        to:
          dimension: Dim Cost Center
          level: la_cost_center_id
  -     unique_name: manufacturing_production_fact_dim-quality_quality_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - quality_id
        to:
          dimension: Dim Quality
          level: la_quality_id
  -     unique_name: manufacturing_production_fact_dim-production-calendar_production_calendar_id
        from:
          dataset: manufacturing_production_fact
          join_columns:
            - production_calendar_id
        to:
          dimension: Dim Production Calendar
          level: la_production_calendar_id
