unique_name: telecom
object_type: model
label: telecom
relationships:
  -     unique_name: telecom_cdr_fact_dim-network_network_id
        from:
          dataset: telecom_cdr_fact
          join_columns:
            - network_id
        to:
          dimension: Dim Network
          level: la_network_id
  -     unique_name: telecom_cdr_fact_dim-subscriber_subscriber_id
        from:
          dataset: telecom_cdr_fact
          join_columns:
            - subscriber_id
        to:
          dimension: Dim Subscriber
          level: la_subscriber_id
  -     unique_name: telecom_cdr_fact_dim-product-plan_plan_id
        from:
          dataset: telecom_cdr_fact
          join_columns:
            - plan_id
        to:
          dimension: Dim Product Plan
          level: la_plan_id
  -     unique_name: telecom_cdr_fact_dim-coverage-geography_geography_id
        from:
          dataset: telecom_cdr_fact
          join_columns:
            - geography_id
        to:
          dimension: Dim Coverage Geography
          level: la_geography_id
  -     unique_name: telecom_cdr_fact_dim-event-time_event_time_id
        from:
          dataset: telecom_cdr_fact
          join_columns:
            - event_time_id
        to:
          dimension: Dim Event Time
          level: la_event_time_id
