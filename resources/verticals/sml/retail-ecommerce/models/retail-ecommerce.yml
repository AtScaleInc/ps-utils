unique_name: retail-ecommerce
object_type: model
label: retail-ecommerce
relationships:
  -     unique_name: retail_sales_fact_dim-product_product_id
        from:
          dataset: retail_sales_fact
          join_columns:
            - product_id
        to:
          dimension: Dim Product
          level: la_product_id
  -     unique_name: retail_sales_fact_dim-store_store_id
        from:
          dataset: retail_sales_fact
          join_columns:
            - store_id
        to:
          dimension: Dim Store
          level: la_store_id
  -     unique_name: retail_sales_fact_dim-promotion_promotion_id
        from:
          dataset: retail_sales_fact
          join_columns:
            - promotion_id
        to:
          dimension: Dim Promotion
          level: la_promotion_id
  -     unique_name: retail_sales_fact_dim-customer_customer_id
        from:
          dataset: retail_sales_fact
          join_columns:
            - customer_id
        to:
          dimension: Dim Customer
          level: la_customer_id
  -     unique_name: retail_sales_fact_dim-fiscal-calendar_fiscal_calendar_id
        from:
          dataset: retail_sales_fact
          join_columns:
            - fiscal_calendar_id
        to:
          dimension: Dim Fiscal Calendar
          level: la_fiscal_calendar_id
