label: insurance
relationships:
  -     unique_name: insurance_policy_fact_dim-policy_policy_dim_id
        from:
          dataset: insurance_policy_fact
          join_columns:
            - policy_dim_id
        to:
          dimension: Dim Policy
          level: la_policy_dim_id
