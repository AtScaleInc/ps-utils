            - distribution_id
        to:
          dimension: Dim Distribution
          level: la_distribution_id
  -     unique_name: insurance_policy_fact_dim-policy-date_policy_date_id
        from:
          dataset: insurance_policy_fact
          join_columns:
            - policy_date_id
        to:
          dimension: Dim Policy Date
          level: la_policy_date_id
