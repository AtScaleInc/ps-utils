unique_name: travel-hospitality
object_type: model
label: travel-hospitality
relationships:
  -     unique_name: travel_reservation_fact_dim-property_property_id
        from:
          dataset: travel_reservation_fact
          join_columns:
            - property_id
        to:
          dimension: Dim Property
          level: la_property_id
  -     unique_name: travel_reservation_fact_dim-room_room_id
        from:
          dataset: travel_reservation_fact
          join_columns:
            - room_id
        to:
          dimension: Dim Room
          level: la_room_id
  -     unique_name: travel_reservation_fact_dim-guest_guest_id
        from:
          dataset: travel_reservation_fact
          join_columns:
            - guest_id
        to:
          dimension: Dim Guest
          level: la_guest_id
  -     unique_name: travel_reservation_fact_dim-booking-channel_channel_id
        from:
          dataset: travel_reservation_fact
          join_columns:
            - channel_id
        to:
          dimension: Dim Booking Channel
          level: la_channel_id
  -     unique_name: travel_reservation_fact_dim-stay-date_stay_date_id
        from:
          dataset: travel_reservation_fact
          join_columns:
            - stay_date_id
        to:
          dimension: Dim Stay Date
          level: la_stay_date_id
