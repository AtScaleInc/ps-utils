unique_name: healthcare
object_type: model
label: healthcare
relationships:
  -     unique_name: healthcare_encounter_fact_dim-facility_facility_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - facility_id
        to:
          dimension: Dim Facility
          level: la_facility_id
  -     unique_name: healthcare_encounter_fact_dim-diagnosis_diagnosis_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - diagnosis_id
        to:
          dimension: Dim Diagnosis
          level: la_diagnosis_id
  -     unique_name: healthcare_encounter_fact_dim-procedure_procedure_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - procedure_id
        to:
          dimension: Dim Procedure
          level: la_procedure_id
  -     unique_name: healthcare_encounter_fact_dim-provider_provider_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - provider_id
        to:
          dimension: Dim Provider
          level: la_provider_id
  -     unique_name: healthcare_encounter_fact_dim-payer_payer_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - payer_id
        to:
          dimension: Dim Payer
          level: la_payer_id
  -     unique_name: healthcare_encounter_fact_dim-service-date_service_date_id
        from:
          dataset: healthcare_encounter_fact
          join_columns:
            - service_date_id
        to:
          dimension: Dim Service Date
          level: la_service_date_id
