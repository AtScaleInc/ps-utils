unique_name: education
object_type: model
label: education
relationships:
  -     unique_name: education_enrollment_fact_dim-student_student_id
        from:
          dataset: education_enrollment_fact
          join_columns:
            - student_id
        to:
          dimension: Dim Student
          level: la_student_id
  -     unique_name: education_enrollment_fact_dim-course_course_id
        from:
          dataset: education_enrollment_fact
          join_columns:
            - course_id
        to:
          dimension: Dim Course
          level: la_course_id
  -     unique_name: education_enrollment_fact_dim-institution_institution_id
        from:
          dataset: education_enrollment_fact
          join_columns:
            - institution_id
        to:
          dimension: Dim Institution
          level: la_institution_id
  -     unique_name: education_enrollment_fact_dim-academic-calendar_academic_calendar_id
        from:
          dataset: education_enrollment_fact
          join_columns:
            - academic_calendar_id
        to:
          dimension: Dim Academic Calendar
          level: la_academic_calendar_id
