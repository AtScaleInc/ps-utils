unique_name: real-estate
object_type: model
label: real-estate
relationships:
  -     unique_name: real_estate_transaction_fact_dim-property_property_id
        from:
          dataset: real_estate_transaction_fact
          join_columns:
            - property_id
        to:
          dimension: Dim Property
          level: la_property_id
  -     unique_name: real_estate_transaction_fact_dim-location_location_id
        from:
          dataset: real_estate_transaction_fact
          join_columns:
            - location_id
        to:
          dimension: Dim Location
          level: la_location_id
  -     unique_name: real_estate_transaction_fact_dim-portfolio_portfolio_id
        from:
          dataset: real_estate_transaction_fact
          join_columns:
            - portfolio_id
        to:
          dimension: Dim Portfolio
          level: la_portfolio_id
  -     unique_name: real_estate_transaction_fact_dim-transaction-date_transaction_date_id
        from:
          dataset: real_estate_transaction_fact
          join_columns:
            - transaction_date_id
        to:
          dimension: Dim Transaction Date
          level: la_transaction_date_id
