        [[ -n "${{ inputs.db-schema }}"            ]] && ARGS+=(--db-schema            "${{ inputs.db-schema }}")
        [[ -n "${{ inputs.target-connection-name }}" ]] && ARGS+=(--target-connection-name "${{ inputs.target-connection-name }}")
        node "${{ github.action_path }}/dist/cli.js" generate-enhanced-query-results "${ARGS[@]}"
