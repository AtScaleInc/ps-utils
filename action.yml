        [[ -n "${{ inputs.ingest-file }}" ]] && ARGS+=(--ingest-file "${{ inputs.ingest-file }}")
        [[ -n "${{ inputs.task-file }}"   ]] && ARGS+=(--task-file   "${{ inputs.task-file }}")
        [[ -n "${{ inputs.run-id }}"      ]] && ARGS+=(--run-id      "${{ inputs.run-id }}")
        [[ -n "${{ inputs.output-dir }}"  ]] && ARGS+=(--output-dir  "${{ inputs.output-dir }}")
